[plugin]
repository = "https://github.com/GitHixy/LootView.git"
commit = "90a4803002ce688b42c06e6ffd4be8694657fb9b"
owners = ["GitHixy"]
project_path = "."
changelog = """
# Version 1.6.1

- New currency drawer beside the loot window with every currency you hold (gil, tomestones, scrips, seals, MGP, PvP marks, tribal currencies and more), each cap and the weekly tomestone limit. Gains flash as they come in. Open it with the coin button; choose left or right in Settings → General.
- A large banner at the top of the screen when someone commends you. Several commendations are counted on one banner, and it waits for the loading screen to finish. Resize, preview or turn it off in Settings → Effects.
- Loot window scale from 60% to 140% in Settings → Appearance; the window can now be made much smaller.
- Need, Greed and Pass buttons now sit right under the item name, so incoming rolls no longer push them away.
- Locking the window from Settings → Appearance now takes effect straight away.
"""
