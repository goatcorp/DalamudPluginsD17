changelog = "v1.5.1 - Converted every ImGui Begin/End and Push/Pop pair (tabs, tables, combos, child windows, IDs, disabled state, style colors) to ImRaii, per review feedback. Ties cleanup to C#'s using scope instead of a manually-written matching call, so a future early return or exception can't leave ImGui's internal state corrupted. Also synced plugin description text across the installer punchline, detailed description, and in-game About tab."
