owners = ["GitHixy"]
project_path = "."
changelog = """
# Version 0.3.0

- Borders no longer draw over the game's windows: hotbars, chat, the party list and the rest now sit on top of them (Settings → General → Hide behind game UI).
- Parts of a border running behind your character are now hidden, following your silhouette, instead of being drawn over you (Settings → General → Hide behind your character).
- New Diagnostics option to outline which windows and which part of your character the borders are kept out of.
- Suggested by players on the FateLimit Discord.
"""
