[plugin]
repository = "https://github.com/GitHixy/LootView.git"
commit = "ca691cf373efa6c88955bacf45148dded0dca631"
owners = ["GitHixy"]
project_path = "."
changelog = """
# Version 1.6.4

- Dice reveal: when an item is resolved, everyone's roll counts up from zero together and stops at its number. The lowest settle first, the last one still climbing takes the crown, then the rows slide into rank order.
- A soft chime when an item goes to someone else. The game only sounds your own wins, so lost rolls were easy to miss. It follows the game's master and system volume and has its own volume in Settings > Tracking.
- The roll window now lists what still needs your choice first, then results, then items you've already chosen on. Results fold into a single line once revealed, and nothing moves while your mouse is over the window.
- Ticker: minimise the loot window and new drops slide in on a slim strip you can drag anywhere, then fade out. Repeat drops add up on one row, and it can also run beside the open window.
- Loot jar: an optional loot window view where your drops fall into a glass jar. Repeat drops merge, and currencies and crystals settle as labelled sand.
"""
