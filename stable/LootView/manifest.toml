project_path = "."
changelog = """
# Version 1.6.2

- In duties with a weekly loot limit, the items that count toward it are tagged in the roll panel. The first one you win, on Need or Greed alike, is your only one until the reset.
- If you've already rolled on another weekly item, a warning above the buttons tells you which. Whichever you win first is the one you keep.
- In alliance raids the roll panel shows a counter (e.g. 7/24 decided) instead of a row for every player. Resolved items list only the Need and Greed rolls, with everyone else summed up in one line.
"""
