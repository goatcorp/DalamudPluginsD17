[plugin]
repository = "https://github.com/GitHixy/LootView.git"
commit = "52aa064f02ebbbeab3c66069d15e65fa49adc735"
owners = ["GitHixy"]
project_path = "."
changelog = """
# Version 1.6.6

- Currencies on their own: the currencies can now have a small window of their own, a currency HUD that stays on screen even with the loot window closed. Move it, resize it from its edges, lock it in place and choose how see-through its background is, from Settings > General. Show or hide it with the coin button or /lv currencies.
- Put your currencies in your own order: drag one up or down, or right-click it to move it. Right-click also hides a currency; hidden ones come back from the same menu or from Settings, and Reset order goes back to the game's order. Works in the drawer as well.
"""
